name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          node --check server.js
          node --check src/database.js
          node --check src/questions.js
          node --check public/app.js

      - name: Run unit tests
        run: npm test

      - name: Boot server and check quiz API
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/quiz > quiz_response.json; then break; fi
            sleep 1
          done
          node -e "const r=require('./quiz_response.json'); if(!r.total||r.total<1||!Array.isArray(r.questions)){process.exit(1)}; console.log('API OK: '+r.total+' questions served')"
          kill $SERVER_PID
